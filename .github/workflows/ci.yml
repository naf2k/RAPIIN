name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: cd server && uv sync --extra dev --locked
      - run: cd server && uv run pytest -q
      - run: cd server && uv run --with pip-audit pip-audit

  agent:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: cd agent && uv sync --extra dev --locked
      - run: cd agent && uv run pytest -q
      - run: cd agent && uv build
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os }}-py${{ matrix.python }}
          path: agent/dist/*

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rapiin:test
          load: true
          # Trivy scans the loaded final filesystem directly. BuildKit provenance
          # otherwise includes packages from discarded build stages as a third-party
          # SBOM and produces false positives for files absent from the final image.
          provenance: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rapiin:test
          severity: CRITICAL,HIGH
          exit-code: "1"
      # The UI is a separate image. Build it here too so a broken
      # Dockerfile.frontend fails CI instead of surfacing at deploy time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: rapiin-frontend:test
          load: true
          provenance: false
          cache-from: type=gha,scope=rapiin-frontend
          cache-to: type=gha,mode=max,scope=rapiin-frontend
      # Run the image, not just build it: proves the unprivileged nginx user can
      # render the template and serve the SPA with a read-only root filesystem.
      - name: Smoke test the frontend image
        run: |
          docker run -d --name rapiin-frontend-smoke -p 8080:8080 \
            --read-only \
            --tmpfs /var/cache/nginx:size=32m,mode=1777 \
            --tmpfs /var/run:size=8m,mode=1777 \
            --tmpfs /etc/nginx/conf.d:size=1m,mode=1777 \
            -e RAPIIN_API_UPSTREAM=127.0.0.1:8000 \
            rapiin-frontend:test
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "frontend image never became healthy"; docker logs rapiin-frontend-smoke; exit 1
          fi
          echo "healthz: $(curl -fsS http://127.0.0.1:8080/healthz)"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          echo "running as: $(docker exec rapiin-frontend-smoke id -un)"
          docker exec rapiin-frontend-smoke id -un | grep -qx nginx
          echo "frontend image serves the SPA as non-root"

  notify-operations:
    if: always()
    needs: [server, agent, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Report failed CI to RAPIIN Operations Center
        env:
          OPS_URL: ${{ secrets.RAPIIN_OPS_URL }}
          OPS_TOKEN: ${{ secrets.RAPIIN_MONITORING_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ -z "$OPS_URL" ] || [ -z "$OPS_TOKEN" ]; then exit 0; fi
          if ! echo "$NEEDS_JSON" | grep -q '"result": "failure"'; then exit 0; fi
          curl --fail --retry 2 -X POST "$OPS_URL/api/internal/ops/signals" \
            -H "Authorization: Bearer $OPS_TOKEN" -H "Content-Type: application/json" \
            --data "{\"source\":\"github-ci\",\"title\":\"CI workflow failed\",\"severity\":\"HIGH\",\"summary\":\"One or more required CI jobs failed.\",\"resource\":\"${GITHUB_REPOSITORY}@${GITHUB_SHA}\",\"details\":{\"run_id\":\"${GITHUB_RUN_ID}\"}}"
