name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: cd server && uv sync --extra dev --locked
      - run: cd server && uv run pytest -q
      - run: cd server && uv run --with pip-audit pip-audit

  agent:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: cd agent && uv sync --extra dev --locked
      - run: cd agent && uv run pytest -q
      - run: cd agent && uv build
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.os }}-py${{ matrix.python }}
          path: agent/dist/*

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: cd server && uv sync --locked
      - run: node --check app.js && node --check chat.js && node --check supervisor.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: beresin:test
          load: true
          # Trivy scans the loaded final filesystem directly. BuildKit provenance
          # otherwise includes packages from discarded build stages as a third-party
          # SBOM and produces false positives for files absent from the final image.
          provenance: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: beresin:test
          severity: CRITICAL,HIGH
          exit-code: "1"

  notify-operations:
    if: always()
    needs: [server, agent, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Report failed CI to BERESIN Operations Center
        env:
          OPS_URL: ${{ secrets.BERESIN_OPS_URL }}
          OPS_TOKEN: ${{ secrets.BERESIN_MONITORING_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ -z "$OPS_URL" ] || [ -z "$OPS_TOKEN" ]; then exit 0; fi
          if ! echo "$NEEDS_JSON" | grep -q '"result": "failure"'; then exit 0; fi
          curl --fail --retry 2 -X POST "$OPS_URL/api/internal/ops/signals" \
            -H "Authorization: Bearer $OPS_TOKEN" -H "Content-Type: application/json" \
            --data "{\"source\":\"github-ci\",\"title\":\"CI workflow failed\",\"severity\":\"HIGH\",\"summary\":\"One or more required CI jobs failed.\",\"resource\":\"${GITHUB_REPOSITORY}@${GITHUB_SHA}\",\"details\":{\"run_id\":\"${GITHUB_RUN_ID}\"}}"
