name: Release Terminal Agent

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: cd agent && uv build
      - run: |
          python -m venv /tmp/beresin-release-test
          /tmp/beresin-release-test/bin/pip install agent/dist/*.whl
          /tmp/beresin-release-test/bin/beresin --help
      - run: python3 ops/checksums.py agent/dist --output agent/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: beresin-agent-python
          path: |
            agent/dist/*.whl
            agent/dist/*.tar.gz
            agent/dist/SHA256SUMS

  install-test:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: cd agent && uv build
      - run: uv tool install agent/dist/*.whl && beresin --help
        shell: bash

  publish:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: install-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beresin-agent-python
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
