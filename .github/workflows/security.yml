name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run --with bandit bandit -q -ll -r server/rapiin agent/rapiin_agent -x server/tests,agent/tests

  notify-operations:
    if: always()
    needs: [secrets, filesystem]
    runs-on: ubuntu-latest
    steps:
      - name: Report failed security scan
        env:
          OPS_URL: ${{ secrets.RAPIIN_OPS_URL }}
          OPS_TOKEN: ${{ secrets.RAPIIN_MONITORING_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if [ -z "$OPS_URL" ] || [ -z "$OPS_TOKEN" ]; then exit 0; fi
          if ! echo "$NEEDS_JSON" | grep -q '"result": "failure"'; then exit 0; fi
          curl --fail --retry 2 -X POST "$OPS_URL/api/internal/ops/signals" \
            -H "Authorization: Bearer $OPS_TOKEN" -H "Content-Type: application/json" \
            --data "{\"source\":\"github-security\",\"title\":\"Security workflow failed\",\"severity\":\"CRITICAL\",\"summary\":\"A required security scan failed.\",\"resource\":\"${GITHUB_REPOSITORY}@${GITHUB_SHA}\",\"details\":{\"run_id\":\"${GITHUB_RUN_ID}\"}}"
