[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beresin-agent"
version = "1.0.0"
description = "BERESIN Desktop Agent - menjalankan pekerjaan file lokal di komputer pegawai"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42.0",
    "keyring>=25.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pillow>=10.0",
]

[project.scripts]
beresin = "beresin_agent.cli:main"
beresin-agent = "beresin_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.setuptools]
packages = ["beresin_agent"]
