[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapiin-agent"
version = "1.1.2"
description = "RAPIIN Desktop Agent - menjalankan pekerjaan file lokal di komputer pegawai"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    # Jangan batasi di bawah 50: cryptography 49+ hanya menerbitkan wheel macOS
    # arm64, sehingga Mac Intel membangun dari sumber dan butuh Rust + Xcode
    # Command Line Tools. Pin <49 sempat dipakai agar Mac Intel dapat wheel
    # universal2, tetapi 48.x membawa dua CVE HIGH (CVE-2026-69247,
    # CVE-2026-69249) yang ditolak gerbang keamanan Trivy. Keamanan menang;
    # prasyarat Mac Intel ditangani di installer (lihat ops/install_rapiin_release.sh).
    "cryptography>=42.0",
    "keyring>=25.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pillow>=10.0",
]

[project.scripts]
rapiin = "rapiin_agent.cli:main"
rapiin-agent = "rapiin_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.setuptools]
packages = ["rapiin_agent"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Lihat server/pyproject.toml: gate bertahap, hanya subset yang sudah bersih.
select = ["F", "E9", "I"]
ignore = ["F841"]
