groups:
  - name: rapiin
    rules:
      - alert: RapiinHighFailureRate
        expr: rapiin_failure_rate > 10 and rapiin_tasks_total >= 10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "RAPIIN task failure rate di atas 10 persen"
      - alert: RapiinQueueBacklog
        expr: rapiin_queue_length > 25
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Antrean RAPIIN menumpuk"
      - alert: RapiinNoOnlineDevice
        expr: rapiin_online_devices == 0 and rapiin_tasks_total > 0
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Tidak ada Desktop Agent online"
