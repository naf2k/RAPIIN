# RAPIIN frontend. Serves the built SPA and proxies /api to the API service so
# the browser talks to a single origin (no CORS, no extra exposure).
#
# Rendered at container start by the nginx image entrypoint, which substitutes
# ${RAPIIN_API_UPSTREAM} from the environment. Default when unset: rapiin:8000.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The moon backdrops are large; let clients reuse them instead of refetching.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /moon.png {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://${RAPIIN_API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # SSE task streams: never buffer, never time the stream out.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Pathname routing lives in the client; unknown paths must return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
