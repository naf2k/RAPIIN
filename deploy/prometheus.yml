global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rapiin
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/monitoring_token
    static_configs:
      - targets: ["rapiin:8000"]
