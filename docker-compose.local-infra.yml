services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rapiin
      POSTGRES_USER: rapiin
      POSTGRES_PASSWORD: ${RAPIIN_POSTGRES_PASSWORD:?Set RAPIIN_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rapiin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapiin -d rapiin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RAPIIN_REDIS_PASSWORD:?Set RAPIIN_REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - rapiin_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RAPIIN_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      RAPIIN_REDIS_PASSWORD: ${RAPIIN_REDIS_PASSWORD:?Set RAPIIN_REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  rapiin_postgres_data:
  rapiin_redis_data:
