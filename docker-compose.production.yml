services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rapiin
      POSTGRES_USER: rapiin
      POSTGRES_PASSWORD: ${RAPIIN_POSTGRES_PASSWORD:?Set RAPIIN_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapiin -d rapiin"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RAPIIN_REDIS_PASSWORD:?Set RAPIIN_REDIS_PASSWORD}"]
    environment:
      RAPIIN_REDIS_PASSWORD: ${RAPIIN_REDIS_PASSWORD:?Set RAPIIN_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RAPIIN_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  rapiin:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAPIIN_DATA_DIR: /app/server/data
      RAPIIN_ENV: production
      RAPIIN_ALLOW_PUBLIC_REGISTRATION: "false"
      RAPIIN_HOST: 0.0.0.0
      RAPIIN_ALLOWED_ORIGINS: https://${RAPIIN_DOMAIN:?Set RAPIIN_DOMAIN}
      RAPIIN_INIT_SUPERVISOR_EMAIL: ${RAPIIN_INIT_SUPERVISOR_EMAIL:?Set supervisor email}
      RAPIIN_SECRET_KEY_FILE: /run/secrets/rapiin_secret_key
      RAPIIN_INIT_SUPERVISOR_PASSWORD_FILE: /run/secrets/supervisor_password
      RAPIIN_MONITORING_TOKEN_FILE: /run/secrets/monitoring_token
      AI_API_KEY_FILE: /run/secrets/ai_api_key
      AI_BASE_URL: ${AI_BASE_URL:?Set HTTPS or private AI provider URL}
      AI_MODEL: ${AI_MODEL:-ai-rapiin}
      # Same PostgreSQL/Redis topology the local pilot and the test suite were
      # verified against; RAPIIN_DB_PATH stays as the SQLite fallback used
      # when RAPIIN_DATABASE_URL is empty.
      RAPIIN_DATABASE_URL: postgresql://rapiin:${RAPIIN_POSTGRES_PASSWORD}@postgres:5432/rapiin
      RAPIIN_REDIS_URL: redis://:${RAPIIN_REDIS_PASSWORD}@redis:6379/0
      # AI Operations agents need the pinned official Hermes runtime, which is
      # not part of this image. Leave disabled until Hermes is provisioned and
      # the sandbox question is settled: the Coder refuses to run without an OS
      # sandbox, so Linux hosts need bubblewrap/firejail first.
      OPS_AGENTS_ENABLED: "false"
    expose: ["8000"]
    volumes:
      - rapiin_data:/app/server/data
    secrets:
      - rapiin_secret_key
      - supervisor_password
      - monitoring_token
      - ai_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Separate queue worker: a long conversation job must not block the API.
    command: [".venv/bin/python", "-m", "rapiin.worker"]
    environment:
      RAPIIN_DATA_DIR: /app/server/data
      RAPIIN_ENV: production
      RAPIIN_SECRET_KEY_FILE: /run/secrets/rapiin_secret_key
      AI_API_KEY_FILE: /run/secrets/ai_api_key
      AI_BASE_URL: ${AI_BASE_URL:?Set HTTPS or private AI provider URL}
      AI_MODEL: ${AI_MODEL:-ai-rapiin}
      RAPIIN_DATABASE_URL: postgresql://rapiin:${RAPIIN_POSTGRES_PASSWORD}@postgres:5432/rapiin
      RAPIIN_REDIS_URL: redis://:${RAPIIN_REDIS_PASSWORD}@redis:6379/0
    secrets:
      - rapiin_secret_key
      - ai_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # nginx proxies /api here; same-origin for the browser.
      RAPIIN_API_UPSTREAM: rapiin:8000
    expose: ["8080"]
    depends_on: [rapiin]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/var/cache/nginx:size=32m", "/var/run:size=8m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  caddy:
    image: caddy:2.10-alpine
    environment:
      RAPIIN_DOMAIN: ${RAPIIN_DOMAIN:?Set RAPIIN_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [monitoring_token]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [rapiin]
    restart: unless-stopped

secrets:
  rapiin_secret_key:
    file: ${RAPIIN_SECRETS_DIR:?Set protected secrets directory}/rapiin_secret_key
  supervisor_password:
    file: ${RAPIIN_SECRETS_DIR:?Set protected secrets directory}/supervisor_password
  monitoring_token:
    file: ${RAPIIN_SECRETS_DIR:?Set protected secrets directory}/monitoring_token
  ai_api_key:
    file: ${RAPIIN_SECRETS_DIR:?Set protected secrets directory}/ai_api_key

volumes:
  rapiin_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
