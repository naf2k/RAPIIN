services:
  rapiin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapiin
    ports:
      - "8000:8000"
    environment:
      RAPIIN_DB_PATH: /app/server/data/rapiin.db
      RAPIIN_DATA_DIR: /app/server/data
      RAPIIN_ENV: production
      RAPIIN_HOST: 0.0.0.0
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:20128/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-ai-rapiin}
      RAPIIN_SECRET_KEY: ${RAPIIN_SECRET_KEY:?Set RAPIIN_SECRET_KEY}
      RAPIIN_ALLOWED_ORIGINS: ${RAPIIN_ALLOWED_ORIGINS:?Set RAPIIN_ALLOWED_ORIGINS to the HTTPS production origin}
      RAPIIN_INIT_SUPERVISOR_EMAIL: ${RAPIIN_INIT_SUPERVISOR_EMAIL:?Set supervisor email}
      RAPIIN_INIT_SUPERVISOR_PASSWORD: ${RAPIIN_INIT_SUPERVISOR_PASSWORD:?Set a unique supervisor password}
    volumes:
      - rapiin_data:/app/server/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rapiin_data:
