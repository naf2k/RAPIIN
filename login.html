<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Masuk ke BERESIN." />
    <title>Masuk | BERESIN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-panel" aria-labelledby="login-title">
        <a class="brand auth-brand" href="index.html" aria-label="BERESIN, kembali ke halaman utama">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span>BERESIN</span>
        </a>
        <div class="auth-copy">
          <p class="eyebrow">Asisten kerja Anda</p>
          <h1 id="login-title">Masuk ke BERESIN</h1>
          <p>Kelola pekerjaan digital Anda dengan aman melalui satu percakapan.</p>
        </div>
        <form class="auth-form" id="login-form">
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="nama@perusahaan.com" required />
          </div>
          <div class="field">
            <label class="field-label" for="password">Kata sandi</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required />
          </div>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="button button--primary auth-submit" id="login-submit" type="submit">Masuk</button>
        </form>
        <p class="auth-note">Dengan masuk, Anda menyetujui penggunaan BERESIN sesuai kebijakan organisasi Anda.</p>
      </section>
    </main>
    <script src="app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // If already authenticated, go straight to the correct home.
        if (BERESIN.isLoggedIn()) {
          BERESIN.redirectByRole(BERESIN.userRole() || "USER");
          return;
        }
        var form = BERESIN.el("login-form");
        var errorBox = BERESIN.el("login-error");
        var submit = BERESIN.el("login-submit");
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          errorBox.hidden = true;
          submit.disabled = true;
          submit.textContent = "Memproses...";
          try {
            var data = await BERESIN.api("POST", "/auth/login", {
              email: BERESIN.el("email").value.trim(),
              password: BERESIN.el("password").value,
            });
            BERESIN.setSession(data.token, { id: data.user_id, name: data.name, role: data.role, email: BERESIN.el("email").value.trim() });
            BERESIN.redirectByRole(data.role);
          } catch (err) {
            errorBox.textContent = err.message;
            errorBox.hidden = false;
            submit.disabled = false;
            submit.textContent = "Masuk";
          }
        });
      });
    </script>
  </body>
</html>
