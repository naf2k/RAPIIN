[project]
name = "rapiin-server"
version = "1.0.0"
description = "Backend RAPIIN - Hermes Core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "httpx>=0.27",
    "msgpack>=1.2.1",
    "setuptools>=78.1.1",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
rapiin-ops = "rapiin.ops_cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Lint gating bertahap: HANYA subset yang sudah bersih yang di-enforce. Ini
# sengaja sempit supaya CI tidak merah; perluas perlahan setelah tiap rule
# dibersihkan. Sisa rule (B008, UP017, BLE001, RUF012, ...) belum di-gate.
select = ["F", "E9", "I"]
# F841 (unused variable) masih ada 5 temuan di kode produksi yang perbaikannya
# menyentuh logika; ditunda ke pekerjaan terpisah agar gate ini tetap hijau.
ignore = ["F841"]

[tool.setuptools.packages.find]
include = ["rapiin*"]
