<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atur cara BERESIN berjalan saat komputer menyala." />
    <title>Pengaturan Startup | BERESIN</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-require-role="USER">
    <main class="app-shell">
      <aside class="sidebar" aria-label="Navigasi BERESIN">
        <div class="sidebar-top">
          <a class="brand" href="../index.html" aria-label="BERESIN, kembali ke percakapan"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span><span>BERESIN</span></a>
          <a class="new-chat-button" href="../index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>Percakapan baru</span></a>
        </div>
        <div class="sidebar-bottom">
          <a class="sidebar-link" href="settings.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg><span>Pengaturan</span></a>
          <a class="sidebar-link" href="#" data-logout><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>Keluar</span></a>
        </div>
      </aside>
      <section class="workspace" aria-label="Pengaturan startup">
        <header class="topbar"><div class="mobile-brand brand" aria-label="BERESIN"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span><span>BERESIN</span></div><div class="connection-status"><span class="status-dot" aria-hidden="true"></span><span>Terhubung</span></div></header>
        <main class="page-content">
          <div class="page-header"><div class="page-header-copy"><a class="breadcrumb" href="settings.html">Pengaturan <span class="breadcrumb-separator">/</span> Startup</a><h1 class="page-title">Cara BERESIN berjalan</h1><p class="page-description">Pilih kapan Desktop Agent mulai berjalan di komputer Anda.</p></div></div>
          <section class="section panel">
            <div class="panel-body">
              <form id="startup-form">
                <div class="setting-list">
                  <label class="setting-row setting-option"><input type="radio" name="startup" value="manual" /><span class="setting-copy"><strong>Mulai secara manual</strong><small>Jalankan BERESIN saat Anda membutuhkannya.</small></span></label>
                  <label class="setting-row setting-option"><input type="radio" name="startup" value="auto" /><span class="setting-copy"><strong>Mulai otomatis saat komputer menyala</strong><small>BERESIN berjalan di latar belakang dan menyambung kembali secara aman.</small></span></label>
                </div>
                <div class="form-actions"><a class="button button--secondary" href="settings.html">Kembali</a><button class="button button--primary" type="submit">Simpan pengaturan</button></div>
              </form>
            </div>
          </section>
          <section class="state state--success section" id="startup-success" hidden>
            <h2>Pengaturan startup disimpan</h2>
            <p>BERESIN akan mengikuti pilihan Anda saat komputer dinyalakan.</p>
          </section>
        </main>
      </section>
    </main>
    <script src="../app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        var saved = "manual";
        try {
          var settings = await BERESIN.api("GET", "/user/settings");
          saved = settings["startup_mode"] || "manual";
        } catch (e) { /* default manual */ }
        var radios = document.querySelectorAll('input[name="startup"]');
        radios.forEach(function (r) { r.checked = r.value === saved; });
        BERESIN.el("startup-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          var selected = document.querySelector('input[name="startup"]:checked');
          var mode = selected ? selected.value : "manual";
          try {
            await BERESIN.api("PUT", "/user/settings", { key: "startup_mode", value: mode });
            BERESIN.el("startup-success").hidden = false;
            BERESIN.showToast("Pengaturan startup disimpan.", "success");
          } catch (err) {
            BERESIN.showError(err.message);
          }
        });
      });
    </script>
  </body>
</html>
